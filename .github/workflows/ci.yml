name: Frontend CI

on:
  pull_request: {}
  push:
    branches: [develop, staging, main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

# PRs share a group by PR number. Push runs each get a distinct group,
# so publishing one develop commit cannot cancel another develop commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  LOCAL_IMAGE: frontend-ci:${{ github.sha }}

jobs:
  verify:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    outputs:
      image_id: ${{ steps.build.outputs.image_id }}

    steps:

      - name: Validate promotion source
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          SOURCE_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          expected=""
          case "$BASE" in
            staging) expected=develop ;;
            main) expected=staging ;;
          esac

          if [[ -n "$expected" ]]; then
            if [[ "$HEAD" != "$expected" || "$SOURCE_REPO" != "$GITHUB_REPOSITORY" ]]; then
              echo "::error::PR into $BASE must come from $expected in $GITHUB_REPOSITORY; received $SOURCE_REPO:$HEAD."
              exit 1
            fi
          fi

      - name: Checkout source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@v6.5.0
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test shared foundation
        run: npm run test

      - name: Build
        run: npm run build

      - name: Build candidate image once
        id: build
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/develop'
        run: |
          docker build --pull --platform linux/amd64 \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$LOCAL_IMAGE" .

          docker image inspect --format '{{.Id}}' "$LOCAL_IMAGE" > image-id.txt
          git rev-parse 'HEAD^{tree}' > source-tree.txt
          printf 'image_id=%s\n' "$(cat image-id.txt)" >> "$GITHUB_OUTPUT"

      - name: Save candidate image before smoke test
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: |
          docker save --output image.tar "$LOCAL_IMAGE"
          sha256sum image.tar > image.tar.sha256

      - name: Smoke test the frontend image
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        env:
          VERIFIED_IMAGE_ID: ${{ steps.build.outputs.image_id }}
        run: |
          docker run --detach --name ci-frontend \
            --publish 127.0.0.1:18080:80 "$VERIFIED_IMAGE_ID"

          application_ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 3 \
              http://127.0.0.1:18080/ > index-smoke.html; then
              if grep -qi '<html' index-smoke.html; then
                application_ready=true
                break
              fi
            fi
            if [[ "$(docker inspect --format '{{.State.Running}}' ci-frontend)" != true ]]; then
              echo "::error::Frontend container exited before becoming ready."
              exit 1
            fi
            sleep 2
          done
          if [[ "$application_ready" != true ]]; then
            echo "::error::Frontend container did not serve an HTML page."
            exit 1
          fi

          curl --fail --silent --show-error --max-time 5 \
            http://127.0.0.1:18080/__ci_spa_probe__ > spa-smoke.html
          if ! cmp --silent index-smoke.html spa-smoke.html; then
            echo "::error::SPA fallback did not return index.html."
            exit 1
          fi

          jq -n '{passed: true, kind: "frontend-http",
            rootPage: true, spaFallback: true}' > smoke-result.json

      - name: Smoke diagnostics and cleanup
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/develop'
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [[ "$JOB_STATUS" != success ]]; then
            docker logs ci-frontend || true
          fi
          docker rm --force ci-frontend > /dev/null 2>&1 || true

      - name: Upload tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: frontend-tested-image
          path: |
            image.tar
            image.tar.sha256
            image-id.txt
            source-tree.txt
            smoke-result.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    name: Publish frontend image
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.release.outputs.image }}
      digest: ${{ steps.release.outputs.digest }}
      commit: ${{ steps.release.outputs.commit }}
      release_artifact_id: ${{ steps.release_artifact.outputs.artifact-id }}

    steps:
      - name: Download tested image
        uses: actions/download-artifact@v8.0.2
        with:
          name: frontend-tested-image
          path: image/

      - name: Load exactly the tested image
        id: load
        env:
          EXPECTED_IMAGE_ID: ${{ needs.verify.outputs.image_id }}
        run: |
          cd image
          sha256sum --check image.tar.sha256
          jq -e '.passed == true' smoke-result.json > /dev/null

          docker load --input image.tar

          expected="$EXPECTED_IMAGE_ID"
          if [[ "$(cat image-id.txt)" != "$expected" ]]; then
            echo "::error::Artifact metadata differs from the verify job output."
            exit 1
          fi
          actual="$(docker image inspect --format '{{.Id}}' "$LOCAL_IMAGE")"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Loaded image differs from the tested image."
            exit 1
          fi

          printf 'image_id=%s\n' "$actual" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" |
            docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Push tested image and write release manifest
        id: release
        env:
          VERIFIED_IMAGE_ID: ${{ steps.load.outputs.image_id }}
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          run_tag="run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          commit_tag="sha-${GITHUB_SHA}"
          run_image="$repository:$run_tag"
          commit_image="$repository:$commit_tag"

          # The unique run tag prevents a rerun of the same SHA from racing
          # with digest resolution. The SHA tag remains a lookup alias.
          docker tag "$VERIFIED_IMAGE_ID" "$run_image"
          docker push "$run_image"

          digest=""
          for attempt in $(seq 1 6); do
            if manifest="$(docker buildx imagetools inspect "$run_image" --format '{{json .Manifest}}')"; then
              if candidate="$(printf '%s' "$manifest" | jq -er '.digest')"; then
                if [[ "$candidate" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                  digest="$candidate"
                  break
                fi
              fi
            fi
            sleep 3
          done

          if [[ -z "$digest" ]]; then
            echo "::error::Cannot resolve the pushed image digest from GHCR."
            exit 1
          fi

          docker tag "$VERIFIED_IMAGE_ID" "$commit_image"
          docker push "$commit_image"

          image_ref="$repository@$digest"
          mkdir -p release
          jq -n \
            --arg component "frontend" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commit "$GITHUB_SHA" \
            --arg sourceBranch "$GITHUB_REF_NAME" \
            --arg sourceTree "$(cat image/source-tree.txt)" \
            --arg image "$image_ref" \
            --arg digest "$digest" \
            --arg tag "$run_tag" \
            --arg commitTag "$commit_tag" \
            --arg imageId "$VERIFIED_IMAGE_ID" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg runUrl "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg createdAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --slurpfile smoke image/smoke-result.json \
            '{
              schemaVersion: 1,
              component: $component,
              repository: $repository,
              commit: $commit,
              sourceTree: $sourceTree,
              sourceBranch: $sourceBranch,
              image: $image,
              digest: $digest,
              tag: $tag,
              commitTag: $commitTag,
              imageId: $imageId,
              platform: "linux/amd64",
              runId: $runId,
              runAttempt: $runAttempt,
              runUrl: $runUrl,
              createdAt: $createdAt,
              smokeTest: $smoke[0]
            }' > release/release.json

          {
            printf 'image=%s\n' "$image_ref"
            printf 'digest=%s\n' "$digest"
            printf 'commit=%s\n' "$GITHUB_SHA"
          } >> "$GITHUB_OUTPUT"

          {
            printf 'Published frontend image\n\n'
            printf 'Commit: %s\n\n' "$GITHUB_SHA"
            printf 'Image: %s\n\n' "$image_ref"
            printf 'Release manifest: release-frontend artifact\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release manifest
        id: release_artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-frontend
          path: release/release.json
          if-no-files-found: error
          retention-days: 30

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
        
  deploy-staging:
    name: Trigger staging deployment
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Trigger infrastructure deployment
        env:
          GH_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          FRONTEND_IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          set -euo pipefail

          : "${GH_TOKEN:?Missing INFRA_DISPATCH_TOKEN}"
          : "${FRONTEND_IMAGE:?Missing published frontend image}"

          gh workflow run deploy-staging.yml \
            --repo 68CS-hotel-booking-system/infrastructure \
            --ref main \
            -f frontend_image="$FRONTEND_IMAGE"
